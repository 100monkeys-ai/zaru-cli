[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.0.0"
license = "Apache-2.0"
authors = ["100monkeys AI, Inc."]
repository = "https://github.com/100monkeys-ai/zaru-cli"

# `rust-version` is a statement of fact -- it is the version pinned in
# `rust-toolchain.toml` -- and not a minimum-supported-Rust-version support
# policy. Nothing is published and nobody depends on this, so there is no
# compatibility promise here to keep. Whoever first ships decides whether one
# is owed.

[workspace.dependencies]
# ADR-0003 D2 names the dependencies the harness will carry -- `rmcp`,
# `ratatui`, `tui-textarea`, `fastembed`, `tokio`, `serde`, `reqwest`. A
# version pinned before anything calls it is a version nobody chose, so a
# dependency arrives here in the arc that has a caller, and each crate takes
# it with `workspace = true` so two crates can never pin two versions of one.
#
# `tokio` is here for its runtime and its test macro, and for nothing else.
# The loop's ports are asynchronous because ADR-0012 D3 has providers stream
# and call tools, and a stub that only ever answers synchronously leaves every
# question about ordering untested. `zaru-core` itself needs no runtime -- its
# port methods return `impl Future` rather than being `async fn`, so the crate
# stays runtime-agnostic -- and takes this as a dev-dependency only, to poll
# those futures under `#[tokio::test]`.
#
# **It became a product dependency of `zaru-cli` on 2026-09-05**, when the
# `gemini` client arrived: a client that opens a socket needs a reactor, and
# `reqwest`'s futures need one to be polled on. That is a caller arriving for
# a crate this table already names rather than a new dependency, which is
# ADR-0003 clause 7's own distinction. `zaru-cli` names `rt` and `macros` for
# its own code and `reqwest` names what it needs on top; the features here are
# still `rt` and `macros` and nothing else, because that is what this
# workspace's own code uses.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "macros",
] }

# `ratatui` is pinned to 0.29 rather than to the newest 0.30.2, and that is a
# constraint rather than a preference. `tui-textarea` 0.7.0 -- the newest, and
# the composer's editing substrate under D2 -- depends on `ratatui ^0.29.0`.
# Taking 0.30.2 puts BOTH in one tree, which `cargo tree -e normal -d` prints:
# two `ratatui` crates means two `Buffer` types and two `Widget` traits, so the
# text area could not be rendered into our own frame at all. 0.29.0 is the
# newest `ratatui` the substrate can actually be used with.
#
# Default features off on both. `ratatui`'s defaults are `crossterm` and
# `underline-color`, and the second pulls crossterm too; `tui-textarea`'s
# default is `crossterm` as well. With them off and `no-backend` on, no
# terminal backend and no socket enters the tree -- which is what makes
# ADR-0005 D3's "the fast tier never touches the network" a property of the
# dependency graph rather than a claim about the code, enforced by
# `scripts/check-crate-boundaries.py`. `no-backend` is also what exposes
# `tui_textarea::{Input, Key}`, the backend-agnostic input type, so keys need
# no crossterm either. `TestBackend` is not feature-gated in 0.29.
# `serde` and `serde_json` are D2's "serialisation" row. The table names
# `serde` alone, and `serde` alone writes no bytes: it is a framework of
# traits and derives, and every actual format lives in a separate crate. So
# the format crate is read as part of the role the table already carries
# rather than as a new dependency, and that reading is recorded as a proposed
# amendment on ADR-0003 rather than made silently here.
#
# `derive` is on because the alternative is hand-written `Serialize` and
# `Deserialize` impls for the stored shape, which are the two places a field
# gets forgotten. `serde_json` is the format ADR-0007 D3 implies by mirroring
# ADR-093's `~/.aegis/auth.json`; `preserve_order` is off, because the stored
# map is a `BTreeMap` and is therefore already ordered by key, which makes a
# saved file's bytes a function of its contents rather than of insertion
# order -- and a file that changes bytes without changing meaning is a file
# nobody can diff.
serde = { version = "1.0.229", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
] }

# `rmcp` is D2's first row: the official MCP SDK, and the whole reason
# `zaru-notes` exists. Default features are off because they are
# `[base64, macros, server]` and `server` is the wrong half for a client --
# it pulls `schemars` and a JSON-Schema derive chain into a product build
# that never serves anything. What `zaru-notes` takes instead is `client`
# plus `transport-async-rw`, and each crate names its own features on top.
#
# `transport-async-rw` is the transport over any `AsyncRead + AsyncWrite`,
# which over `tokio::io::duplex` is a real MCP session with no socket: the
# JSON-RPC frames are serialised, framed and parsed exactly as they would be
# over a network, and nothing listens on a port. That is what lets every
# check in this crate exchange real protocol bytes offline.
#
# **The streamable HTTP transport ADR-0103 names is deliberately not taken.**
# It arrives through this crate's own `transport-streamable-http-client-reqwest`
# feature -- so it needs no new row in D2's table, `reqwest` being already
# named there -- and it costs 113 further packages including a `cmake`-driven
# C build of `aws-lc-sys`. No check in this crate may open a socket and no
# credential exists here, so all 113 would arrive unexercised. A dependency
# arrives in the arc that has a caller; that arc holds a token and can prove
# it works.
rmcp = { version = "3.2.0", default-features = false }

ratatui = { version = "0.29.0", default-features = false }
tui-textarea = { version = "0.7.0", default-features = false, features = [
    "no-backend",
] }

# `aes-gcm` and `keyring` are D2's rows for ADR-0007 D3, accepted 2026-09-05
# under directive 20, and they arrive here in the arc that has a caller.
#
# **Both are at their current major and that pairing is the reason for each
# version.** `keyring` 4 is built on `keyring-core` and its default `v1`
# feature reaches the Secret Service through `zbus`, which is pure Rust; the
# alternative measured on 2026-09-05 was `keyring` 3 with `sync-secret-service`,
# 43 packages smaller but linking `libdbus-1`, a C system library. This
# repository has none, D2's table contemplates none, and ADR-0003 D7 promises a
# default install that is "zaru alone" -- a binary that will not start on a box
# without a system library is not that. `aes-gcm` 0.11 rather than 0.10 follows
# from it: 0.10 is built on the `cipher` 0.4 stack and `keyring` 4's is `cipher`
# 0.5, so pairing 0.10 with `keyring` 4 puts two `aes`, two `cipher` and two
# `crypto-common` in one tree -- the same duplication `ratatui` is pinned to
# 0.29 to avoid, measured the same way with `cargo tree`.
#
# Default features off on `aes-gcm`, then three named. `aes` is what makes it
# AES rather than a generic AEAD. `alloc` is what gives `Payload`, which is how
# associated data is passed. `getrandom` is what gives the nonce and the key,
# and it is the one place this crate's randomness differs from the ULID's
# `/dev/urandom` -- see `credentials::sealing::key::SealingKey::mint` for why
# that precedent deliberately does not transfer. The remaining features are
# `arrayvec`, `bytes`, `hazmat`, `rand_core` and `zeroize`; none has a caller.
#
# `keyring` takes its defaults, and that is deliberate rather than an omission:
# `default = ["v1"]` and the crate carries `compile_error!("At least one of the
# features 'v1' or 'cli' must be enabled")`, so there is no way to take it
# without a real backend. That matters because `keyring` 3, in the same
# position, silently falls back to an in-memory mock.
aes-gcm = { version = "0.11.1", default-features = false, features = [
    "aes",
    "alloc",
    "getrandom",
] }
keyring = { version = "4.2.0" }

# `toml` is D2's row for the three files this workspace's records name:
# [ADR-0009] D1's `./zaru.toml`, ADR-0014 D1's layers 2 and 3, and ADR-0010
# D1's `meta.toml`. It was accepted into that table on 2026-09-05 under
# directive 20 and this is the arc that gives it a caller.
#
# 1.1.5 rather than 0.9, and that is a measurement rather than a preference.
# 1.1.5 adds SIX packages -- `serde_spanned`, `toml`, `toml_datetime`,
# `toml_parser`, `toml_writer` and `winnow` -- and 0.9.12 adds seven, because
# 0.9 pulls TWO `winnow` versions into one tree. Measured on 2026-09-05 against
# the 109-package tree of that morning, which gave 115 and 116; the delta is the
# number that matters, since other arcs move the baseline. None of the six is a
# direct dependency outside D2's table and none is on
# `scripts/check-crate-boundaries.py`'s network list.
#
# Default features off, and the four named are exactly what `default` is --
# which is the point. Naming them is what stops a future default, `preserve_order`
# or `fast_hash`, arriving in this tree without a decision. `serde` is not
# optional despite this crate deriving nothing: `toml::Table` and `toml::Value`,
# the untyped document model `config::file` converts from, are
# `#[cfg(feature = "serde")]` in 1.x. Measured by compiling without it --
# "cannot find `Table` in `toml` ... the item is gated behind the `serde`
# feature" -- and it adds no package, because `serde_core` is already resolved.
# `display` is on for ADR-0010's `meta.toml` writer, whose values arrive from
# outside and must be escaped by the crate that defines the format rather than
# by us.
toml = { version = "1.1.5", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }

# `reqwest` is D2's "HTTP" row, and 2026-09-05 is the day it got a caller: the
# `gemini` provider client, which is the first thing in this workspace that
# can reach a model at all. Until then the row was in the record and not in
# this file, for the reason at the top of this block.
#
# **`rustls-tls` rather than `default-tls`, and the closure is why.** Measured
# 2026-09-05 in a scratch copy with `cargo tree -p zaru-cli -e normal`, which
# is feature-aware where `Cargo.lock` is not -- the lock resolves optional
# dependencies whether a feature turns them on or not, so it reports 285
# packages where 217 are built. Four TLS choices, all within one crate of each
# other in size, so size decided nothing:
#
#   rustls-tls               217 crates   ring, webpki-roots
#   rustls-tls-webpki-roots  217 crates   identical
#   rustls-tls-native-roots  218 crates   + rustls-native-certs, openssl-probe
#   default-tls              217 crates   + native-tls, openssl, OPENSSL-SYS
#
# `default-tls` is refused for the reason `keyring` 4 was chosen over
# `keyring` 3 above: it links `libssl` and `libcrypto`, C system libraries,
# and ADR-0003 D7 promises a default install that is "zaru alone" -- a binary
# that will not start on a box without a system library is not that.
# `rustls-tls-native-roots` needs the host to have a trust store;
# `rustls-tls` carries Mozilla's roots in the binary and needs nothing from
# the machine it runs on.
#
# **One honest cost.** `ring` compiles C and assembly through `cc`, so a build
# now needs a C compiler where it did not before. It is not `aws-lc-sys` and
# it needs no `cmake` -- which is what the `rmcp` block above measured as the
# price of the streamable-HTTP transport, 113 packages including a
# cmake-driven build. This is the cheaper half of that trade, and CONTRIBUTING
# says so where a contributor will read it.
#
# Default features off, then two named. `json` is the request and response
# bodies, which are `serde_json` values this workspace already carries.
# `rustls-tls` is above. Everything else reqwest offers -- `blocking`,
# `cookies`, `gzip`, `multipart`, `stream`, `http3` -- has no caller: ADR-0012
# D3's streaming is deliberately not built by this arc, so not even `stream`
# is taken.
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# `regex` is D2's row for [ADR-0009] D3's third `expect` kind, `matches =
# "<regex>"`, accepted 2026-09-05 under directive 20 as amendment 4, and this
# is the arc that gives it a caller.
#
# **It costs zero packages in `Cargo.lock` and three in the build tree**,
# measured 2026-09-05 against the 206-package lock and the 162-package
# `zaru-cli` closure of that morning: the resolution already carries `regex`
# 1.13.1 for `keyring` 4's `windows-native-keyring-store`, which is
# platform-gated and never compiled here. `regex-lite` was the alternative and
# is the LARGER tree, not the smaller: `boon` below takes `regex`, so
# `regex-lite` would put two engines in one tree -- the duplication `ratatui`
# is pinned to 0.29 and `aes-gcm` to 0.11 to avoid, measured the same way.
#
# **`fancy-regex` was disqualified rather than merely measured.** A validator's
# pattern arrives in a file from a repository the user cloned, and the
# evaluator runs on the harness's own thread, which `ProcessCeiling` does not
# bound -- that ceiling bounds a child. `regex` carries the guarantee that
# makes an untrusted pattern safe there, in its own words: "all regex searches
# in this crate have worst case `O(m * n)` time complexity", because "it lacks
# several features that are not known how to implement efficiently. This
# includes, but is not limited to, look-around and backreferences."
#
# Default features off, then two named. `std` is what gives `Regex` at all.
# `unicode` is what lets a project's pattern spell `\d`, `\w` and `\p{...}`;
# refusing them would be an implementation inventing a restriction ADR-0009
# states nowhere. The pair costs NO package over `std` alone -- only
# `perf-literal` costs one, `aho-corasick`, and it is off. **And while `boon`
# is in the tree this declaration narrows nothing**, because `boon` takes
# `regex` with default features and Cargo unifies them; it records what this
# crate's own code needs, so that removing `boon` later cannot silently keep
# the wider set. Said rather than claimed as a saving.
regex = { version = "1.13.1", default-features = false, features = [
    "std",
    "unicode",
] }

[workspace.lints.rust]
# Every public item carries a doc comment. `cargo clippy -- -D warnings` in CI
# turns this into a failure, which is what keeps ADR-0003 D8's one-crate-one-
# responsibility discipline legible instead of aspirational.
missing_docs = "warn"

# `deny` rather than `forbid`: a crate that genuinely needs `unsafe` can carry
# a recorded `#[allow]` with its reason, which is reviewable. `forbid` cannot
# be lifted without editing this file, which turns a local judgement into a
# workspace-wide change.
unsafe_code = "deny"
