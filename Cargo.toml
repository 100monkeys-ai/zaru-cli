[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.0.0"
license = "Apache-2.0"
authors = ["100monkeys AI, Inc."]
repository = "https://github.com/100monkeys-ai/zaru-cli"

# `rust-version` is a statement of fact -- it is the version pinned in
# `rust-toolchain.toml` -- and not a minimum-supported-Rust-version support
# policy. Nothing is published and nobody depends on this, so there is no
# compatibility promise here to keep. Whoever first ships decides whether one
# is owed.

[workspace.dependencies]
# ADR-0003 D2 names the dependencies the harness will carry -- `rmcp`,
# `ratatui`, `ratatui-textarea`, `fastembed`, `tokio`, `serde`, `reqwest`. A
# version pinned before anything calls it is a version nobody chose, so a
# dependency arrives here in the arc that has a caller, and each crate takes
# it with `workspace = true` so two crates can never pin two versions of one.
#
# `tokio` is here for its runtime and its test macro, and for nothing else.
# The loop's ports are asynchronous because ADR-0012 D3 has providers stream
# and call tools, and a stub that only ever answers synchronously leaves every
# question about ordering untested. `zaru-core` itself needs no runtime -- its
# port methods return `impl Future` rather than being `async fn`, so the crate
# stays runtime-agnostic -- and takes this as a dev-dependency only, to poll
# those futures under `#[tokio::test]`.
#
# **It became a product dependency of `zaru-cli` on 2026-09-05**, when the
# `gemini` client arrived: a client that opens a socket needs a reactor, and
# `reqwest`'s futures need one to be polled on. That is a caller arriving for
# a crate this table already names rather than a new dependency, which is
# ADR-0003 clause 7's own distinction.
#
# **The features here are `rt` and `macros` and nothing else, and that is a
# statement about this row rather than about the workspace.** Each crate names
# what its own code uses on top, and Cargo unifies them: `zaru-cli` names
# `net`, `time`, `sync` and `process` on its own line, `reqwest` and `rmcp`
# name what they need, and this row carries only what a crate taking `tokio =
# { workspace = true }` with no features of its own gets. The sentence here
# said "`zaru-cli` names `rt` and `macros` for its own code" until 2026-09-05,
# which stopped being true the day the composition built the reactor; it is
# corrected rather than left, because a comment that names the wrong crate's
# feature set is worse than none.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "macros",
] }

# `ratatui` is 0.30 and the composer's editing substrate is `ratatui-textarea`
# 0.8.0, and the two moved together on 2026-09-28 because neither could move
# alone. `ratatui` 0.29.0 required `lru ^0.12`, and `lru` 0.12.5 carries
# RUSTSEC-2026-0002 (GHSA-rhfx-m35p-ff5j, patched in 0.16.3) and
# RUSTSEC-2026-0253 (patched in 0.18.2); 0.30.0 is the first `ratatui` whose
# `ratatui-core` admits a patched `lru` at all, and `ratatui-core` 0.1.1, which
# 0.30.1 onward requires, is the first to require `lru ^0.18`. `tui-textarea`
# 0.7.0 -- its newest release, and the substrate D2 names -- requires
# `ratatui ^0.29.0`, so taking 0.30 beside it put two `ratatui` crates, two
# `Buffer` types and two `Widget` traits in one tree and left `lru` 0.12.5 in
# it. `ratatui-textarea` is `tui-textarea`'s continuation under the ratatui
# organisation (rhysd/tui-textarea issue #125); 0.8.0 is its port to 0.30 with
# no other change, and the 0.9 line's cursor and word-motion fixes are
# deliberately not taken here, because this move must change nothing a person
# sees. Measured by `crates/zaru-tui/src/shell/captures.rs` and the wire
# capture in `zaru-cli`'s terminal checks, both committed on 0.29 first.
#
# Default features off on both, and then two named on `ratatui` that 0.29 did
# not need to name: in 0.29 the standard library and the layout cache were
# unconditional, and 0.30 made them features, so `std` and `layout-cache` are
# what keep this build doing what the 0.29 build did rather than a capability
# arriving. `ratatui`'s remaining defaults are `crossterm`, `underline-color`,
# `all-widgets` and `macros`, and none is taken -- not even `crossterm`; see
# `ratatui-crossterm` below for why the backend is its own row.
# `ratatui-textarea`'s default is `crossterm`, so with it off no terminal
# backend enters through the substrate: its `Input`
# and `Key` are the backend-agnostic input type, as `tui-textarea`'s were
# under `no-backend`. With no backend named here, no socket enters the tree --
# which is what makes ADR-0005 D3's "the fast tier never touches the network"
# a property of the dependency graph rather than a claim about the code,
# enforced by `scripts/check-crate-boundaries.py`.
# `serde` and `serde_json` are D2's "serialisation" row. The table names
# `serde` alone, and `serde` alone writes no bytes: it is a framework of
# traits and derives, and every actual format lives in a separate crate. So
# the format crate is read as part of the role the table already carries
# rather than as a new dependency, and that reading is recorded as a proposed
# amendment on ADR-0003 rather than made silently here.
#
# `derive` is on because the alternative is hand-written `Serialize` and
# `Deserialize` impls for the stored shape, which are the two places a field
# gets forgotten. `serde_json` is the format ADR-0007 D3 implies by mirroring
# ADR-093's `~/.aegis/auth.json`; `preserve_order` is off, because the stored
# map is a `BTreeMap` and is therefore already ordered by key, which makes a
# saved file's bytes a function of its contents rather than of insertion
# order -- and a file that changes bytes without changing meaning is a file
# nobody can diff.
serde = { version = "1.0.229", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
] }

# ADR-0003 amendment 7: local concrete-syntax parsing for ADR-0035.  These
# grammars compile into the binary and parse bytes already admitted by the
# filesystem boundary; none opens a network connection or downloads grammar
# data at runtime.
tree-sitter = { version = "0.25.10", default-features = false }
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.23.6"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.23.4"
tree-sitter-java = "0.23.5"

# `rmcp` is D2's first row: the official MCP SDK, and the whole reason
# `zaru-notes` exists. Default features are off because they are
# `[base64, macros, server]` and `server` is the wrong half for a client --
# it pulls `schemars` and a JSON-Schema derive chain into a product build
# that never serves anything. What `zaru-notes` takes instead is `client`
# plus `transport-async-rw`, and each crate names its own features on top.
#
# `transport-async-rw` is the transport over any `AsyncRead + AsyncWrite`,
# which over `tokio::io::duplex` is a real MCP session with no socket: the
# JSON-RPC frames are serialised, framed and parsed exactly as they would be
# over a network, and nothing listens on a port. That is what lets every
# check in this crate exchange real protocol bytes offline.
#
# **The streamable HTTP transport ADR-0103 names is deliberately not taken.**
# It arrives through this crate's own `transport-streamable-http-client-reqwest`
# feature -- so it needs no new row in D2's table, `reqwest` being already
# named there -- and it costs 113 further packages including a `cmake`-driven
# C build of `aws-lc-sys`. No check in this crate may open a socket and no
# credential exists here, so all 113 would arrive unexercised. A dependency
# arrives in the arc that has a caller; that arc holds a token and can prove
# it works.
rmcp = { version = "3.2.0", default-features = false }

# `sse-stream` and `futures` are read as part of `rmcp`'s own row's role
# rather than as two new roles, in the shape D2's `serde_json` line already
# blessed for `serde`: "the format crate is read as part of the role the table
# already carries rather than as a new dependency, and that reading is recorded
# as a proposed amendment on ADR-0003 rather than made silently here."
#
# **The reading is narrower than `serde_json`'s and that is the point.** These
# two are not a capability this workspace chose; they are the types `rmcp`
# spells its own public trait in. `StreamableHttpClient` -- the seam the
# streamable-HTTP transport is implemented against when the SDK's own reqwest
# client is not taken -- has `BoxStream<'static, Result<Sse, SseError>>` in
# three of its six method signatures, and `rmcp` re-exports **only** `SseError`
# (`pub use sse_stream::Error as SseError`). `Sse` is not re-exported,
# `futures` is not re-exported, and `bounded_sse_stream` and
# `DEFAULT_MAX_SSE_EVENT_SIZE` are `pub(crate)`. Measured by reading
# `rmcp-3.2.0/src/transport/streamable_http_client.rs` and
# `.../common/client_side_sse.rs`, not inferred: implementing that trait
# outside the SDK is not possible without naming both crates.
#
# **Both cost zero packages, by both instruments.** `Cargo.lock` already
# carries `futures 0.3.34` (ten `futures*` rows) and gains `sse-stream 0.2.6`
# from `rmcp`'s own `client-side-sse` feature whether this row exists or not.
# The whole lock delta for the transport is three packages -- `base64 0.23.1`,
# `sse-stream 0.2.6` and `wasm-streams 0.4.2`, the last a `wasm32` target
# dependency of `reqwest`'s `stream` feature that no build on this platform
# compiles -- measured 314 to 317 with `grep -c '^\[\[package\]\]'`.
#
# `futures` takes `std` alone. Its default adds `async-await` and `executor`,
# and this crate wants neither: what it uses is `StreamExt::map` and
# `StreamExt::boxed`, and an executor in a crate that is handed someone else's
# runtime is a second reactor nobody asked for. `sse-stream` declares
# `default = []` and its one optional feature is `tracing`, which has no
# caller here.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
sse-stream = { version = "0.2.6", default-features = false }

ratatui = { version = "0.30.2", default-features = false, features = [
    "std",
    "layout-cache",
] }
ratatui-textarea = { version = "0.8.0", default-features = false }

# `ratatui-crossterm` is the crossterm backend `ratatui` 0.30 split out of
# itself, taken directly and not through `ratatui`'s `crossterm` feature,
# because that feature takes this crate WITH its defaults and one of them is
# `underline-color`. In 0.29 `underline-color` was a `ratatui` default this
# workspace turned off; in 0.30 it is this crate's default, reached through
# the feature, and with it on the backend ends every frame with an extra
# `ESC[59m` -- measured by the wire capture in `zaru-cli`'s terminal checks,
# the one difference the move made. Default features off, and exactly
# `crossterm_0_29`, which is the one `crossterm` in the lock. The cost is that
# `ratatui::try_init` and `ratatui::try_restore` live behind that feature, so
# `zaru-cli` takes the terminal and gives it back itself, in
# `terminal::driver`.
ratatui-crossterm = { version = "0.1.2", default-features = false, features = [
    "crossterm_0_29",
] }

# `aes-gcm` and `keyring` are D2's rows for ADR-0007 D3, accepted 2026-09-05
# under directive 20, and they arrive here in the arc that has a caller.
#
# **Both are at their current major and that pairing is the reason for each
# version.** `keyring` 4 is built on `keyring-core` and its default `v1`
# feature reaches the Secret Service through `zbus`, which is pure Rust; the
# alternative measured on 2026-09-05 was `keyring` 3 with `sync-secret-service`,
# 43 packages smaller but linking `libdbus-1`, a C system library. This
# repository has none, D2's table contemplates none, and ADR-0003 D7 promises a
# default install that is "zaru alone" -- a binary that will not start on a box
# without a system library is not that. `aes-gcm` 0.11 rather than 0.10 follows
# from it: 0.10 is built on the `cipher` 0.4 stack and `keyring` 4's is `cipher`
# 0.5, so pairing 0.10 with `keyring` 4 puts two `aes`, two `cipher` and two
# `crypto-common` in one tree -- the same duplication `ratatui` is pinned to
# 0.29 to avoid, measured the same way with `cargo tree`.
#
# Default features off on `aes-gcm`, then three named. `aes` is what makes it
# AES rather than a generic AEAD. `alloc` is what gives `Payload`, which is how
# associated data is passed. `getrandom` is what gives the nonce and the key,
# and it is the one place this crate's randomness differs from the ULID's
# `/dev/urandom` -- see `credentials::sealing::key::SealingKey::mint` for why
# that precedent deliberately does not transfer. The remaining features are
# `arrayvec`, `bytes`, `hazmat`, `rand_core` and `zeroize`; none has a caller.
#
# `keyring` takes its defaults, and that is deliberate rather than an omission:
# `default = ["v1"]` and the crate carries `compile_error!("At least one of the
# features 'v1' or 'cli' must be enabled")`, so there is no way to take it
# without a real backend. That matters because `keyring` 3, in the same
# position, silently falls back to an in-memory mock.
aes-gcm = { version = "0.11.1", default-features = false, features = [
    "aes",
    "alloc",
    "getrandom",
] }
keyring = { version = "4.2.0" }

# `toml` is D2's row for the three files this workspace's records name:
# [ADR-0009] D1's `./zaru.toml`, ADR-0014 D1's layers 2 and 3, and ADR-0010
# D1's `meta.toml`. It was accepted into that table on 2026-09-05 under
# directive 20 and this is the arc that gives it a caller.
#
# 1.1.5 rather than 0.9, and that is a measurement rather than a preference.
# 1.1.5 adds SIX packages -- `serde_spanned`, `toml`, `toml_datetime`,
# `toml_parser`, `toml_writer` and `winnow` -- and 0.9.12 adds seven, because
# 0.9 pulls TWO `winnow` versions into one tree. Measured on 2026-09-05 against
# the 109-package tree of that morning, which gave 115 and 116; the delta is the
# number that matters, since other arcs move the baseline. None of the six is a
# direct dependency outside D2's table and none is on
# `scripts/check-crate-boundaries.py`'s network list.
#
# Default features off, and the four named are exactly what `default` is --
# which is the point. Naming them is what stops a future default, `preserve_order`
# or `fast_hash`, arriving in this tree without a decision. `serde` is not
# optional despite this crate deriving nothing: `toml::Table` and `toml::Value`,
# the untyped document model `config::file` converts from, are
# `#[cfg(feature = "serde")]` in 1.x. Measured by compiling without it --
# "cannot find `Table` in `toml` ... the item is gated behind the `serde`
# feature" -- and it adds no package, because `serde_core` is already resolved.
# `display` is on for ADR-0010's `meta.toml` writer, whose values arrive from
# outside and must be escaped by the crate that defines the format rather than
# by us.
toml = { version = "1.1.5", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }

# `reqwest` is D2's "HTTP" row, and 2026-09-05 is the day it got a caller: the
# `gemini` provider client, which is the first thing in this workspace that
# can reach a model at all. Until then the row was in the record and not in
# this file, for the reason at the top of this block.
#
# **`rustls-tls` rather than `default-tls`, and the closure is why.** Measured
# 2026-09-05 in a scratch copy with `cargo tree -p zaru-cli -e normal`, which
# is feature-aware where `Cargo.lock` is not -- the lock resolves optional
# dependencies whether a feature turns them on or not, so it reports 285
# packages where 217 are built. Four TLS choices, all within one crate of each
# other in size, so size decided nothing:
#
#   rustls-tls               217 crates   ring, webpki-roots
#   rustls-tls-webpki-roots  217 crates   identical
#   rustls-tls-native-roots  218 crates   + rustls-native-certs, openssl-probe
#   default-tls              217 crates   + native-tls, openssl, OPENSSL-SYS
#
# `default-tls` is refused for the reason `keyring` 4 was chosen over
# `keyring` 3 above: it links `libssl` and `libcrypto`, C system libraries,
# and ADR-0003 D7 promises a default install that is "zaru alone" -- a binary
# that will not start on a box without a system library is not that.
# `rustls-tls-native-roots` needs the host to have a trust store;
# `rustls-tls` carries Mozilla's roots in the binary and needs nothing from
# the machine it runs on.
#
# **One honest cost.** `ring` compiles C and assembly through `cc`, so a build
# now needs a C compiler where it did not before. It is not `aws-lc-sys` and
# it needs no `cmake` -- which is what the `rmcp` block above measured as the
# price of the streamable-HTTP transport, 113 packages including a
# cmake-driven build. This is the cheaper half of that trade, and CONTRIBUTING
# says so where a contributor will read it.
#
# Default features off, then two named. `json` is the request and response
# bodies, which are `serde_json` values this workspace already carries.
# `rustls-tls` is above. Everything else reqwest offers -- `blocking`,
# `cookies`, `gzip`, `multipart`, `stream`, `http3` -- has no caller: ADR-0012
# D3's streaming is deliberately not built by this arc, so not even `stream`
# is taken.
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# `regex` is D2's row for [ADR-0009] D3's third `expect` kind, `matches =
# "<regex>"`, accepted 2026-09-05 under directive 20 as amendment 4, and this
# is the arc that gives it a caller.
#
# **It costs zero packages in `Cargo.lock` and three in the build tree**,
# measured 2026-09-05 against the 206-package lock and the 162-package
# `zaru-cli` closure of that morning: the resolution already carries `regex`
# 1.13.1 for `keyring` 4's `windows-native-keyring-store`, which is
# platform-gated and never compiled here. The three are still three on the
# baseline this actually landed on -- `reqwest` arrived in between and brings
# no regex engine. `regex-lite` was the alternative and
# is the LARGER tree, not the smaller: `boon` below takes `regex`, so
# `regex-lite` would put two engines in one tree -- the duplication `ratatui`
# is pinned to 0.29 and `aes-gcm` to 0.11 to avoid, measured the same way.
#
# **`fancy-regex` was disqualified rather than merely measured.** A validator's
# pattern arrives in a file from a repository the user cloned, and the
# evaluator runs on the harness's own thread, which `ProcessCeiling` does not
# bound -- that ceiling bounds a child. `regex` carries the guarantee that
# makes an untrusted pattern safe there, in its own words: "all regex searches
# in this crate have worst case `O(m * n)` time complexity", because "it lacks
# several features that are not known how to implement efficiently. This
# includes, but is not limited to, look-around and backreferences."
#
# Default features off, then two named. `std` is what gives `Regex` at all.
# `unicode` is what lets a project's pattern spell `\d`, `\w` and `\p{...}`;
# refusing them would be an implementation inventing a restriction ADR-0009
# states nowhere. The pair costs NO package over `std` alone -- only
# `perf-literal` costs one, `aho-corasick`, and it is off. **And while `boon`
# is in the tree this declaration narrows nothing**, because `boon` takes
# `regex` with default features and Cargo unifies them; it records what this
# crate's own code needs, so that removing `boon` later cannot silently keep
# the wider set. Said rather than claimed as a saving.
regex = { version = "1.13.1", default-features = false, features = [
    "std",
    "unicode",
] }

# `boon` is D2's row for [ADR-0009] D3's fourth `expect` kind,
# `json_schema = "<path>"`, accepted 2026-09-05 under directive 20 as
# amendment 5, and this is the arc that gives it a caller. Drafts 4, 6, 7,
# 2019-09 and 2020-12, with 2020-12 pinned as the default -- see
# `crate::validators::schema` for why a default draft is pinned rather than
# taken.
#
# **Two numbers, and the difference between them is the point.** Measured
# alone on 2026-09-05 against the 206-package lock and the 162-package
# `zaru-cli` closure of that morning, this row costs 41 and 42 -- the largest
# single addition this workspace would have made, and eighteen of the
# forty-two are the ICU crates `url` and `idna` pull for `$id` and `$ref`
# resolution, which the loader in `crate::validators::schema` never uses.
# **Measured on the baseline it actually landed on, `regex` and `boon`
# together cost 12 packages in the lock and 13 in the build tree** (288 to
# 300, 220 to 233): `reqwest` landed in between and had already brought
# `url`, `idna` and the whole ICU chain, so twenty-nine of the forty-two were
# paid for by a decision that had its own reasons. Both numbers are here
# because the first is what this row costs on its own merits and the second
# is what a reader of this tree will measure.
#
# A licence scan of all forty-two returns Unicode-3.0, MIT OR Apache-2.0,
# MIT, Apache-2.0 OR MIT, Unlicense OR MIT, MIT-0 and BSD-2-Clause OR
# Apache-2.0 OR MIT, and no copyleft, so D7's clean scan holds.
#
# **`jsonschema` 0.53 was measured and refused twice over.** At its defaults
# it is 336/258, because `resolve-http` and `tls-aws-lc-rs` pull `reqwest`,
# `rustls` and a cmake-driven C build of `aws-lc-sys` -- the same chain the
# `rmcp` comment above already refuses by name. With default features off it
# is 243/199, four packages smaller than this row, and it compiles a schema's
# own `pattern` keyword with `fancy-regex`, which backtracks. A schema
# arrives in a file from a repository the user cloned and this evaluator runs
# on the harness's own thread, which `ProcessCeiling` does not bound. `boon`
# uses `regex`, so a project's schema inherits the row above's `O(m * n)`
# guarantee. Five packages for one engine and one bound.
#
# `valico` 4.0.0 (254/211) is larger, unreleased since 2023 and also on
# `fancy-regex`; `jsonschema-valid` 0.5.2 (240/199) is the smallest and is
# MPL-2.0, which D7's clean-scan argument is about.
#
# Default features off, and `boon` declares none at all -- named for the same
# reason every other row here names them: so that a future default cannot
# arrive in this tree without a decision.
boon = { version = "0.6.1", default-features = false }

# `pulldown-cmark` is D2's row for the CommonMark parser the transcript pane
# renders an answer's text with, accepted 2026-09-15 as amendment 6, and this
# is the arc that gives it a caller. It closes the markdown half of row 4 of
# the look-and-feel survey, whose colour half `colour-registers` closed on
# 2026-09-14 saying the remainder "needs a record, because it decides a
# dependency (ADR-0003 D2's table)".
#
# **A pull parser rather than a tree.** The renderer walks events, which is
# what lets a partially-arrived answer be parsed on the beat: a tree would
# have to be rebuilt and re-walked from the root for every delta, and the
# pane repaints on a 100 ms tick.
#
# **Both instruments, measured on `a8eedf7` against a 317-package lock.**
# `Cargo.lock` gains **two** packages -- this crate and `unicase` 2.9.0,
# which has no dependencies of its own -- and `cargo tree -p pulldown-cmark
# --edges normal` gives the whole closure as `bitflags 2.13.1`, `memchr
# 2.8.3` and `unicase 2.9.0`, the first two already resolved here for
# `ratatui` and `regex-automata`. That is the smallest addition this table
# has taken since `regex`, which cost none.
#
# **`default-features = false` is load-bearing and the default is
# `["getopts", "html"]`.** `html` pulls `pulldown-cmark-escape`, an HTML
# renderer, which is the one thing a terminal pane must not carry -- refusing
# it is what keeps this a *parser* row. `getopts` exists only for the crate's
# own `[[bin]]`, declared `required-features = ["getopts"]`, which nothing
# here runs. `serde` is off.
#
# **`simd` is off and that is the security-relevant one.** The crate carries
# `#![cfg_attr(not(feature = "simd"), forbid(unsafe_code))]`, so with the
# features taken here it **forbids** `unsafe` -- this workspace's own
# `[workspace.lints.rust] unsafe_code = "deny"` posture arriving in a
# dependency by construction rather than by hope.
#
# **No build-time toolchain arrives.** The crate has a `build.rs` and its
# body is behind `#[cfg(feature = "gen-tests")]`, so without that feature it
# compiles to nothing: no C compiler and no `cmake` beyond what `ring`
# already asks for.
#
# **MIT, and it is the only row in this table that is not dual-licensed.**
# Permissive, one-way compatible into Apache-2.0 distribution, and it scans
# clean, so D3's licence and D7's clean-scan argument are untouched. What it
# does not carry is an express patent grant, which Apache-2.0 does -- named
# here rather than discovered later, and batched for Jeshua.
#
# **No syntax highlighter.** `syntect`, `two-face` and `bat` are refused: a
# highlighter needs a grammar set, the grammar set is the dependency, and a
# pane that colours code by a grammar it shipped is asserting a language it
# may have guessed wrong. A fenced block is indented and left alone.
pulldown-cmark = { version = "0.13.4", default-features = false }

# ADR-0005's third strip corpus needs to know what `.gitignore` says, and this
# is the crate that knows. A row in ADR-0003 D2's table, added 2026-09-15 under
# a delegated coordinator ruling and open to Jeshua's veto.
#
# **The alternative was writing the glob semantics here, and it is refused in
# `fs.search`'s own words**: "choosing a glob semantics -- whether `**` crosses
# a symlink, whether a leading dot matches -- is authoring that vocabulary in
# the place it is least visible". A `.gitignore` is a pattern language with a
# specification, negations, anchoring and per-directory scope; a subset of it
# written by hand would be a second, undocumented language a person's project
# would silently disagree with.
#
# **Why it is not optional.** Measured on this machine: the harness's own tree
# walks to **434 entries in 0.6 ms** with its `.gitignore` honoured and
# **101,493 entries in 60 ms warm, 1.31 s cold** without it, because `target/`
# is in there. A corpus built without the ignore rule is not a slower corpus,
# it is a corpus of build artefacts.
#
# **Measured cost, both instruments the rows above use.** `grep -c
# '^\[\[package\]\]' Cargo.lock`: **319 to 327, +8** -- `bstr`,
# `crossbeam-deque`, `crossbeam-epoch`, `globset`, `ignore`, `same-file`,
# `walkdir` and `winapi-util`, the last of which no Linux build compiles.
# `cargo tree -p zaru-cli -e normal --prefix none`, deduplicated: **246 to
# 253, +7**; `regex-automata` and `memchr` are already here for the `regex`
# row above, which is most of what a glob engine would otherwise have cost.
#
# **`zaru-tui`'s closure is unchanged**, which is the number that matters for
# ADR-0005 D3: the port is declared there and carries nothing, the walk is
# here, and `scripts/check-crate-boundaries.py` still passes.
#
# Default features off: `simd-accel` is the only one and it is a nightly
# feature.
ignore = { version = "0.4.33", default-features = false }

[workspace.lints.rust]
# Every public item carries a doc comment. `cargo clippy -- -D warnings` in CI
# turns this into a failure, which is what keeps ADR-0003 D8's one-crate-one-
# responsibility discipline legible instead of aspirational.
missing_docs = "warn"

# `deny` rather than `forbid`: a crate that genuinely needs `unsafe` can carry
# a recorded `#[allow]` with its reason, which is reviewable. `forbid` cannot
# be lifted without editing this file, which turns a local judgement into a
# workspace-wide change.
unsafe_code = "deny"
