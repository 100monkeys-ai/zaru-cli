[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.0.0"
license = "Apache-2.0"
authors = ["100monkeys AI, Inc."]
repository = "https://github.com/100monkeys-ai/zaru-cli"

# `rust-version` is a statement of fact -- it is the version pinned in
# `rust-toolchain.toml` -- and not a minimum-supported-Rust-version support
# policy. Nothing is published and nobody depends on this, so there is no
# compatibility promise here to keep. Whoever first ships decides whether one
# is owed.

[workspace.dependencies]
# ADR-0003 D2 names the dependencies the harness will carry -- `rmcp`,
# `ratatui`, `tui-textarea`, `fastembed`, `tokio`, `serde`, `reqwest`. A
# version pinned before anything calls it is a version nobody chose, so a
# dependency arrives here in the arc that has a caller, and each crate takes
# it with `workspace = true` so two crates can never pin two versions of one.
#
# `tokio` is here for its runtime and its test macro, and for nothing else.
# The loop's ports are asynchronous because ADR-0012 D3 has providers stream
# and call tools, and a stub that only ever answers synchronously leaves every
# question about ordering untested. `zaru-core` itself needs no runtime -- its
# port methods return `impl Future` rather than being `async fn`, so the crate
# stays runtime-agnostic -- and takes this as a dev-dependency only, to poll
# those futures under `#[tokio::test]`. Hence `rt` and `macros` and nothing
# else: nothing in this workspace yet spawns, sleeps, or opens a socket.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "macros",
] }

# `ratatui` is pinned to 0.29 rather than to the newest 0.30.2, and that is a
# constraint rather than a preference. `tui-textarea` 0.7.0 -- the newest, and
# the composer's editing substrate under D2 -- depends on `ratatui ^0.29.0`.
# Taking 0.30.2 puts BOTH in one tree, which `cargo tree -e normal -d` prints:
# two `ratatui` crates means two `Buffer` types and two `Widget` traits, so the
# text area could not be rendered into our own frame at all. 0.29.0 is the
# newest `ratatui` the substrate can actually be used with.
#
# Default features off on both. `ratatui`'s defaults are `crossterm` and
# `underline-color`, and the second pulls crossterm too; `tui-textarea`'s
# default is `crossterm` as well. With them off and `no-backend` on, no
# terminal backend and no socket enters the tree -- which is what makes
# ADR-0005 D3's "the fast tier never touches the network" a property of the
# dependency graph rather than a claim about the code, enforced by
# `scripts/check-crate-boundaries.py`. `no-backend` is also what exposes
# `tui_textarea::{Input, Key}`, the backend-agnostic input type, so keys need
# no crossterm either. `TestBackend` is not feature-gated in 0.29.
# `serde` and `serde_json` are D2's "serialisation" row. The table names
# `serde` alone, and `serde` alone writes no bytes: it is a framework of
# traits and derives, and every actual format lives in a separate crate. So
# the format crate is read as part of the role the table already carries
# rather than as a new dependency, and that reading is recorded as a proposed
# amendment on ADR-0003 rather than made silently here.
#
# `derive` is on because the alternative is hand-written `Serialize` and
# `Deserialize` impls for the stored shape, which are the two places a field
# gets forgotten. `serde_json` is the format ADR-0007 D3 implies by mirroring
# ADR-093's `~/.aegis/auth.json`; `preserve_order` is off, because the stored
# map is a `BTreeMap` and is therefore already ordered by key, which makes a
# saved file's bytes a function of its contents rather than of insertion
# order -- and a file that changes bytes without changing meaning is a file
# nobody can diff.
serde = { version = "1.0.229", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
] }

ratatui = { version = "0.29.0", default-features = false }
tui-textarea = { version = "0.7.0", default-features = false, features = [
    "no-backend",
] }

[workspace.lints.rust]
# Every public item carries a doc comment. `cargo clippy -- -D warnings` in CI
# turns this into a failure, which is what keeps ADR-0003 D8's one-crate-one-
# responsibility discipline legible instead of aspirational.
missing_docs = "warn"

# `deny` rather than `forbid`: a crate that genuinely needs `unsafe` can carry
# a recorded `#[allow]` with its reason, which is reviewable. `forbid` cannot
# be lifted without editing this file, which turns a local judgement into a
# workspace-wide change.
unsafe_code = "deny"
