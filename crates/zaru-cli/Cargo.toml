[package]
name = "zaru-cli"
description = "The zaru binary: configuration, session lifecycle, and the error taxonomy."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "zaru"
path = "src/main.rs"

[dependencies]
zaru-aegis = { path = "../zaru-aegis" }
zaru-core = { path = "../zaru-core" }
zaru-notes = { path = "../zaru-notes" }
zaru-seal = { path = "../zaru-seal" }
zaru-tui = { path = "../zaru-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
# ADR-0007 D3's at-rest half. See `[workspace.dependencies]` for why these
# two versions and not their neighbours.
aes-gcm = { workspace = true }
keyring = { workspace = true }
toml = { workspace = true }
# ADR-0012 D3's first provider client. See `[workspace.dependencies]` for why
# `rustls-tls` and for the C-compiler cost that comes with it.
reqwest = { workspace = true }
# A product dependency since 2026-09-05, not a dev one: `reqwest`'s futures
# need a reactor to be polled on, and `providers::gemini` is what polls them.
tokio = { workspace = true, features = ["rt", "macros"] }
# ADR-0009 D3's third `expect` kind. See `[workspace.dependencies]` for why
# this crate and not `zaru-core`, and for what the two features buy.
regex = { workspace = true }

[dev-dependencies]
# The two halves of the outside-caller check in `tests/notes_scope_from_outside.rs`,
# which drives a stored credential through a real MCP session with no socket.
# Both are rows in ADR-0003 D2's table and both are already resolved in
# `Cargo.lock` for `zaru-notes`, so neither adds a package: the lock stays at
# 109 and gains two lines naming them here. `server` is the half `zaru-notes`
# deliberately does not ship, so the fixture on the other end of the session is
# a real MCP server standing up in this process.
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
