[package]
name = "zaru-cli"
description = "The zaru binary: configuration, session lifecycle, and the error taxonomy."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "zaru"
path = "src/main.rs"

[dependencies]
zaru-aegis = { path = "../zaru-aegis" }
zaru-core = { path = "../zaru-core" }
zaru-notes = { path = "../zaru-notes" }
zaru-seal = { path = "../zaru-seal" }
zaru-tui = { path = "../zaru-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
# ADR-0007 D3's at-rest half. See `[workspace.dependencies]` for why these
# two versions and not their neighbours.
aes-gcm = { workspace = true }
keyring = { workspace = true }
toml = { workspace = true }
# ADR-0012 D3's first provider client. See `[workspace.dependencies]` for why
# `rustls-tls` and for the C-compiler cost that comes with it.
reqwest = { workspace = true }
# A product dependency since 2026-09-05, not a dev one: `reqwest`'s futures
# need a reactor to be polled on, and `providers::gemini` is what polls them.
#
# **`net` and `time` were added on 2026-09-05 when the composition built the
# reactor**, and they are declared rather than inherited. `reqwest` already
# enables both on this same crate, so Cargo's feature unification made
# `Builder::enable_all()` compile without them -- which is a rule that holds by
# circumstance rather than by construction, and it would break in a confusing
# place the day `reqwest`'s own feature set moved. Declaring what this
# workspace's own code uses is what `[workspace.dependencies]`' comment asks
# for, and it is the difference between a build that works and a build that
# says why.
#
# **Measured, and the cost is nothing**: `Cargo.lock` is unchanged at 300
# packages and `cargo tree -p zaru-cli -e normal` is unchanged, because both
# features were already resolved for `reqwest`. ADR-0003 clause 7's own
# distinction -- a caller arriving for a crate D2's table already names, rather
# than a new dependency.
#
# **`sync` was added on 2026-09-05 when the iteration loop was wired**, for
# the same reason and by the same rule. `tool_call::run` takes the tool
# surface by `&mut` and ADR-0009 D4's inner-loop branch in one call, so the
# session's ONE `tools::Executor` needs two handles; both port methods
# declare `+ Send` and the executor awaits under the guard, and a
# `std::sync::MutexGuard` is `!Send` while `tokio::sync::MutexGuard` is `Send`
# where its contents are. That is the whole of why the lock is this one --
# see `crate::compose::shared`.
#
# **Measured with both instruments on 2026-09-05: zero and zero.** The lock
# stays at 314 packages (`grep -c '^\[\[package\]\]' Cargo.lock`) and the
# `zaru-cli` closure at 242 unique packages (`cargo tree -p zaru-cli -e normal
# --prefix none`, deduplicated), because `reqwest` already enables `sync` on
# this same crate. Declared rather than inherited for the reason the paragraph
# above gives.
#
# **`process` was added on 2026-09-05 when a child process became a future**,
# for the same reason and by the same rule. `crate::process::Spawn::execute`
# ran a `std::process::Command` on the calling thread until then -- `try_wait`,
# a sleep, and two reader threads joined at the end -- and it is reached from
# two asynchronous ports, so for the whole of a `cmd.run` or a declared
# validator's command the session's one current-thread runtime was blocked: no
# beat fired, no keystroke was read, and a `Ctrl-C` was not seen until the
# child returned. `tokio::process::Child` is what makes the wait and the two
# reads futures that yield, and `kill_on_drop` is what makes dropping the
# turn's future end the child rather than orphan it. **The io driver is
# load-bearing rather than incidental**: `tokio::process` panics with *"A Tokio
# 1.x context was found, but IO is disabled"* on a runtime built without it,
# which `compose::turn::runtime`'s `enable_all` supplies and a check pins.
#
# **Measured with both instruments on 2026-09-05: zero and zero.** The lock
# stays at 314 packages (`grep -c '^\[\[package\]\]' Cargo.lock`) and the
# `zaru-cli` closure at 242 unique packages (`cargo tree -p zaru-cli -e normal
# --prefix none`, deduplicated); `cargo tree -e normal -d` is byte-identical at
# 294 lines, so no crate is duplicated by it. The whole `Cargo.lock` delta is
# ONE line -- `signal-hook-registry` joining `tokio`'s dependency list, a
# package already resolved for `crossterm`'s `signal-hook`. A feature of a crate
# ADR-0003 D2's table already names is that record's clause 7 caller-arrives
# case, which is the shape D2 already blessed for `rmcp`'s transport and for
# `ratatui`'s `crossterm`.
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "net",
    "time",
    "sync",
    "process",
    "fs",
] }
# ADR-0009 D3's third `expect` kind. See `[workspace.dependencies]` for why
# this crate and not `zaru-core`, and for what the two features buy.
regex = { workspace = true }
# ADR-0009 D3's fourth `expect` kind. See `[workspace.dependencies]` for the
# measurement and for why this crate and not `jsonschema`.
boon = { workspace = true }
# ADR-0005's third strip corpus, and the only thing this crate asks of it is
# what `.gitignore` says. See `[workspace.dependencies]` for the two measured
# numbers, and for why a hand-written subset of that language was refused.
ignore = { workspace = true }
# ADR-0015 D2's in-session half needs a terminal, and this is where the
# terminal backend arrives. `crossterm` is a FEATURE of a crate ADR-0003 D2
# already names -- its row's role is "Terminal UI" in as many words -- and
# `ratatui` re-exports it as `ratatui::crossterm`, so no `crossterm` line
# appears in any manifest here. That is the shape D2 already blessed for
# `rmcp`'s streamable-HTTP transport: "it arrives through this crate's own
# ... feature, so it needs no new row in D2's table".
#
# The feature is named HERE and not on the workspace row, because this is the
# crate that wants a backend: `zaru-tui` renders into a `Frame` and reads
# `tui_textarea::Input`, both backend-agnostic, and its checks drive
# `TestBackend`, which is not feature-gated in 0.29. Cargo unifies features
# across workspace members, so `zaru-tui`'s closure gains `crossterm` either
# way and `scripts/check-crate-boundaries.py` is what says that is allowed --
# measured, both placements, on 2026-09-05. Naming it here is a statement of
# where the backend is wanted rather than a mechanism.
#
# Measured cost with `grep -c '^\[\[package\]\]' Cargo.lock`: **300 packages
# to 314, +14**, rooted at `crossterm 0.28.1`. Measured three times against
# three bases as peers landed, and **the delta is the number that matters**:
# 206 -> 233 (+27) on the morning of 2026-09-05, 288 -> 302 (+14) after
# `provider-client` landed `reqwest` and `tokio`, and 300 -> 314 (+14) after
# `validators-remaining` landed `regex` and `boon`. The drop from 27 to 14 is
# `reqwest` and `tokio` already bringing `mio`, `rustix`, `smallvec`,
# `linux-raw-sys` and the `windows-sys` family, so over half of what a terminal
# backend would have cost this workspace was paid for a different reason. What
# is left is `crossterm` itself, `parking_lot`, `signal-hook` and the `winapi`
# shims no Linux build compiles.
ratatui = { workspace = true, features = ["crossterm"] }

[dev-dependencies]
# The two halves of the outside-caller check in `tests/notes_scope_from_outside.rs`,
# which drives a stored credential through a real MCP session with no socket.
# Both are rows in ADR-0003 D2's table and both are already resolved in
# `Cargo.lock` for `zaru-notes`, so neither adds a package: the lock stays at
# 109 and gains two lines naming them here. `server` is the half `zaru-notes`
# deliberately does not ship, so the fixture on the other end of the session is
# a real MCP server standing up in this process.
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
